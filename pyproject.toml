[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyconza-regbot"
version = "0.1.0"
description = "PyConZA Discord registration bot"
authors = [{name = "Adam Piskorski", email = "adam@piskorski.me"}]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "httpx>=0.25.0",
    "gspread-asyncio>=1.9.0",
    "ics>=0.7.2",
    "arrow>=1.3.0",
    "google-api-python-client>=2.184.0",
    "google-auth>=2.41.1",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "pytz>=2025.2",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "simcord[pytest]>=3.0.1,<4",
    "pre-commit>=4.0",
    "ruff>=0.16",
    "ty>=0.0.84",
    "rich>=15.0",
    "bpython>=0.24",
]

[tool.setuptools.packages.find]
include = ["regbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = [
    ".git",
    ".vscode",
    ".pytest_cache",
    ".mypy_cache",
    "__pycache__",
    "templates",
]

[tool.ruff]
lint.select = [
    "A",
    "B",
    "BLE",
    "C4",
    "C90",
    "D",
    "DTZ",
    "E",
    "ERA",
    "F",
    "I",
    "ICN",
    "INP",
    "ISC",
    "N",
    "PGH",
    "PIE",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "T10",
    "T20",
    "TC",
    "TID",
    "UP",
    "W",
]
lint.ignore = ["E501", "D", "S311", "S101"]
line-length = 90
show-fixes = true
target-version = "py314"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# One-off maintenance scripts: not a package and print() is their UI
"regbot/scripts/*" = ["INP001", "T201"]
# Test fakes deliberately mirror the googleapiclient camelCase method names
"tests/*" = ["N802"]

[tool.ty.rules]
# discord.py exposes broad channel unions (e.g. GuildChannel | PrivateChannel) and
# imprecise decorator signatures, so these two rules mostly produce noise here.
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
